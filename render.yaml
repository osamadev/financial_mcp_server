services:
  - type: web
    name: financial-mcp-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: false   # recommended for a public "Deploy to Render" button repo
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_AUTH_MODE
        # static | oauth | none
        # If static, MCP_ACCESS_TOKEN is required.
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_UNAUTHENTICATED_HTTP
        # Optional. Set true only for local/dev testing.
        sync: false
      # Render injects PORT automatically; server.py reads it.
      - key: MCP_ACCESS_TOKEN
        # Required when MCP_AUTH_MODE=static (default). Leave empty only for oauth/none.
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_USER_ID
        sync: false
      - key: ENABLE_TELEGRAM_ALERTS
        # Optional. Set true to enable Telegram alert sends.
        sync: false
      - key: PORTFOLIO_FILE
        sync: false
      - key: OLLAMA_HOST
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: SUMMARIZER_PROVIDER
        value: ollama
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OAUTH_ISSUER_URL
        sync: false
      - key: OAUTH_ISSUER_URLS
        sync: false
      - key: OAUTH_JWKS_URL
        sync: false
      - key: OAUTH_AUDIENCE
        sync: false
      - key: OAUTH_REQUIRED_SCOPES
        value: mcp.tools
      - key: OAUTH_SCOPES_SUPPORTED
        sync: false
      - key: MCP_RESOURCE_SERVER_URL
        sync: false
      - key: OAUTH_BROKER_ENABLED
        # Optional. Set true when using built-in OAuth broker.
        sync: false
      - key: OAUTH_BROKER_ISSUER_URL
        sync: false
      - key: OAUTH_BROKER_CLIENT_ID
        sync: false
      - key: OAUTH_BROKER_CLIENT_SECRET
        sync: false
      - key: OAUTH_BROKER_SCOPE
        sync: false
